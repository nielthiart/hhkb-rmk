[package]
name = "hhkb-rmk"
version = "0.1.0"
edition = "2024"

# No test harness on this target; without these, rust-analyzer's check fails.
[[bin]]
name = "hhkb-rmk"
test = false
bench = false

[dependencies]
# Keep host_lock: Vial's matrix tester needs it.
rmk = { version = "=0.9.0", default-features = false, features = ["storage", "vial", "host_lock", "watchdog", "nrf52840_ble", "adafruit_bl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "unstable-pac", "time"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
nrf-mpsl = { version = "0.4.0", features = ["critical-section-impl", "nrf52840"] }
nrf-sdc = { version = "0.4.0", features = ["peripheral", "central", "nrf52840"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1"
static_cell = "2"

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
